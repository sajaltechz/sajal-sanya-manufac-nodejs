version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: manufac
      POSTGRES_PASSWORD: manufac
      POSTGRES_DB: manufac
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manufac -d manufac"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://manufac:manufac@db:5432/manufac?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
